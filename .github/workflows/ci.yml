name: CI Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  frontend-tests:
    name: Flutter Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Install dependencies
        run: flutter pub get
        working-directory: ./frontend
          
      - name: Generate Mocks
        run: dart run build_runner build --delete-conflicting-outputs
        working-directory: ./frontend

      - name: Create .env Mock for Flutter
        run: |
          touch .env
          echo "API_URL=http://localhost:8000" > .env
        working-directory: ./frontend

      - name: Run Tests
        run: flutter test --coverage
        working-directory: ./frontend

      - name: Upload Flutter coverage
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: frontend/coverage/lcov.info

  backend-tests:
    name: FastAPI Tests
    env:
      FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip' # caching pip dependencies
          
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
        
      - name: Create Firebase Config Mock
        run: |
          echo "{}" > gestion-transporte-dev-firebase-adminsdk-fbsvc-390f3bdf34.json
        working-directory: ./backend

      - name: Run Tests with pytest
        run: pytest app/tests/ --cov=app --cov-report=xml:coverage.xml
        working-directory: ./backend
        env:
          PYTHONPATH: .
          FIREBASE_CREDENTIALS: gestion-transporte-dev-firebase-adminsdk-fbsvc-390f3bdf34.json

      - name: Upload Python coverage
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: backend/coverage.xml

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    needs: [ frontend-tests, backend-tests ]
    if: always()
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Frontend Deps
        run: flutter pub get
        working-directory: ./frontend

      - name: Generate Mocks
        run: dart run build_runner build --delete-conflicting-outputs
        working-directory: ./frontend

      - name: Download Flutter coverage
        uses: actions/download-artifact@v4
        with:
          name: flutter-coverage
          path: frontend/coverage

      - name: Download Python coverage
        uses: actions/download-artifact@v4
        with:
          name: python-coverage
          path: backend

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}